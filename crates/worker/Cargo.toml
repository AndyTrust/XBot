[package]
name = "xbot-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "xbot-worker"
path = "src/main.rs"

[dependencies]
xbot-core = { version = "0.1.0", path = "../core" }
xbot-provider = { version = "0.1.0", path = "../provider" }
async-trait = "0.1.92"
base64 = "0.23.1"
futures-util = { version = "0.3.34", features = ["sink"] }
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rmcp = { version = "3.7.0", features = ["server", "transport-async-rw"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
