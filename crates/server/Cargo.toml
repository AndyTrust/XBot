[package]
name = "xbot-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie-signed", "cookie-key-expansion"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
cron = "0.17.0"
futures = "0.3.34"
xbot-core = { version = "0.1.0", path = "../core" }
xbot-db = { version = "0.1.0", path = "../db" }
xbot-provider = { version = "0.1.0", path = "../provider" }
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.3"
rusqlite = "0.41.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "otpauth", "gen_secret"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# --- S2 --- collegamenti, canali MCP, voce
rmcp = { version = "3.7.0", features = ["server", "client", "transport-async-rw", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
http = "1"
web-push-native = "0.5.0"
# --- 2.H --- il ponte WebSocket verso ttyd.
tokio-tungstenite = "0.30.0"
mail-parser = "1.0.0"
mail-builder = "2.0.0"
tokio-rustls = "0.26.6"
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
